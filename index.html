<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorial</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <hgroup>
        <h1 class="title" id="title" aria-label="Factorial"></h1>
        <p class="subTitle">
          Ingresa un <strong class="resultado">número</strong> superior a 0
        </p>
      </hgroup>
      <form action="" id="formulario" class="container-label col">
        <label for="entrada">
          <span class="entrada"> Entrada: </span>
          <input
            required
            type="number"
            min="1"
            step="1"
            placeholder="Coloca un número"
            id="entrada"
            name="entrada"
            aria-label="entrada"
          />
        </label>
        <label for="resultado" class="container-label col">
          <span>Resultado: </span>
          <output
            name="resultado"
            for="entrada"
            id="resultado"
            tabindex="0"
            aria-label="resultado"
            class="resultado"
          >
          </output>
        </label>
      </form>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
